<body class="bg-background min-h-screen flex items-center justify-center p-md text-on-surface">
<div class="w-full max-w-sm bg-surface-container-lowest rounded-xl shadow-sm border border-outline-variant p-lg flex flex-col gap-xl">
<!-- Header Section -->
<div class="flex flex-col items-center text-center gap-sm">
<div class="w-16 h-16 bg-primary-container rounded-full flex items-center justify-center mb-sm">
<span class="material-symbols-outlined text-3xl text-on-primary-container" style="font-variation-settings: 'FILL' 1;">
                    headset_mic
                </span>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-background">
                CallReport
            </h1>
<p class="font-body-md text-body-md text-on-surface-variant">
                Reportes de llamadas en tiempo real
            </p>
</div>
<!-- Form Section -->
<form class="flex flex-col gap-md">
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface" for="email">Correo electrónico</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">
                        mail
                    </span>
<input class="w-full pl-10 pr-3 py-2 bg-surface-container-lowest border border-outline-variant rounded focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all font-body-md text-body-md text-on-surface placeholder-on-surface-variant/50 outline-none" id="email" placeholder="agente@empresa.com" required="" type="email"/>
</div>
</div>
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface" for="password">Contraseña</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">
                        lock
                    </span>
<input class="w-full pl-10 pr-10 py-2 bg-surface-container-lowest border border-outline-variant rounded focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all font-body-md text-body-md text-on-surface placeholder-on-surface-variant/50 outline-none" id="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-outline hover:text-on-surface transition-colors focus:outline-none" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined text-[20px]" id="visibility-icon">
                            visibility
                        </span>
</button>
</div>
</div>
<button class="w-full mt-sm py-2 px-4 bg-primary text-on-primary rounded font-label-md text-label-md hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center gap-2" type="submit">
                Iniciar sesión
                <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</form>
<!-- Footer Section -->
<div class="text-center mt-sm">
<a class="font-body-sm text-body-sm text-primary hover:underline underline-offset-4 focus:outline-none focus:ring-2 focus:ring-primary/20 rounded px-1 py-0.5" href="#">
                ¿Olvidaste tu contraseña?
            </a>
</div>
</div>
<script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const visibilityIcon = document.getElementById('visibility-icon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                visibilityIcon.textContent = 'visibility_off';
            } else {
                passwordInput.type = 'password';
                visibilityIcon.textContent = 'visibility';
            }
        }
    </script>
</body></html>
