<body class="h-full bg-background text-on-background font-body-md text-body-md antialiased overflow-hidden md:hidden">
<!-- TopAppBar -->
<header class="sticky top-0 w-full z-50 flex items-center justify-between px-md py-sm bg-surface dark:bg-surface-dim border-b border-outline-variant dark:border-outline h-14">
<div class="flex items-center space-x-2">
<span class="material-symbols-outlined text-primary dark:text-primary-fixed cursor-pointer">menu</span>
<h1 class="font-headline-sm text-headline-sm text-primary dark:text-primary-fixed">CallReport</h1>
</div>
<div class="flex items-center bg-surface-container-low rounded-full px-3 py-1 border border-outline-variant/50">
<span class="font-label-sm text-label-sm text-on-surface-variant truncate max-w-[120px]">Acme Corp — Ventas Q3</span>
<span class="material-symbols-outlined text-on-surface-variant text-[16px] ml-1">swap_horiz</span>
</div>
</header>
<!-- Main Content Canvas -->
<main class="h-[calc(100vh-112px)] overflow-y-auto px-md py-4 pb-24 relative">
<form class="space-y-6 max-w-lg mx-auto">
<!-- Section 1: Datos del contacto -->
<section class="bg-surface-container-lowest border border-outline-variant rounded-xl p-4 shadow-sm">
<h2 class="font-label-md text-label-md text-on-surface mb-4 flex items-center">
<span class="material-symbols-outlined mr-2 text-[18px]">person</span> Datos del contacto
                </h2>
<div class="space-y-4">
<div>
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-1" for="nombre">Nombre</label>
<input class="w-full border border-outline-variant rounded-lg px-3 py-2 bg-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-shadow font-body-md text-body-md" id="nombre" placeholder="Nombre completo" type="text"/>
</div>
<div>
<label class="block font-label-sm text-label-sm text-error mb-1" for="telefono">Teléfono</label>
<input class="w-full border border-error rounded-lg px-3 py-2 bg-surface focus:outline-none focus:ring-2 focus:ring-error focus:border-transparent transition-shadow font-body-md text-body-md" id="telefono" placeholder="Ej: 555-0123" type="tel" value="555-xyz"/>
<p class="text-error font-body-sm text-body-sm mt-1 flex items-center">
<span class="material-symbols-outlined text-[14px] mr-1" style="font-variation-settings: 'FILL' 1;">error</span> Ingresa un teléfono válido
                        </p>
</div>
<div>
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-1" for="correo">Correo (opcional)</label>
<input class="w-full border border-outline-variant rounded-lg px-3 py-2 bg-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-shadow font-body-md text-body-md" id="correo" placeholder="ejemplo@correo.com" type="email"/>
</div>
</div>
</section>
<!-- Section 2: Tipificación -->
<section>
<h2 class="font-label-md text-label-md text-on-surface mb-3 px-1">Tipificación</h2>
<div class="grid grid-cols-2 gap-2">
<label class="cursor-pointer relative">
<input class="peer sr-only" name="tipificacion" type="radio" value="completada"/>
<div class="border border-outline-variant rounded-lg p-3 text-center bg-surface-container-lowest peer-checked:bg-primary-container peer-checked:border-primary peer-checked:text-on-primary-container transition-colors">
<span class="material-symbols-outlined mb-1 block text-secondary" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<span class="font-label-sm text-label-sm">Venta Completada</span>
</div>
</label>
<label class="cursor-pointer relative">
<input class="peer sr-only" name="tipificacion" type="radio" value="consulta"/>
<div class="border border-outline-variant rounded-lg p-3 text-center bg-surface-container-lowest peer-checked:bg-primary-container peer-checked:border-primary peer-checked:text-on-primary-container transition-colors">
<span class="material-symbols-outlined mb-1 block text-surface-tint">support_agent</span>
<span class="font-label-sm text-label-sm">Consulta Resuelta</span>
</div>
</label>
<label class="cursor-pointer relative">
<input class="peer sr-only" name="tipificacion" type="radio" value="pendiente"/>
<div class="border border-outline-variant rounded-lg p-3 text-center bg-surface-container-lowest peer-checked:bg-primary-container peer-checked:border-primary peer-checked:text-on-primary-container transition-colors">
<span class="material-symbols-outlined mb-1 block text-[#f59e0b]">schedule</span>
<span class="font-label-sm text-label-sm">Seguimiento Pendiente</span>
</div>
</label>
<label class="cursor-pointer relative">
<input class="peer sr-only" name="tipificacion" type="radio" value="no_interesado"/>
<div class="border border-outline-variant rounded-lg p-3 text-center bg-surface-container-lowest peer-checked:bg-primary-container peer-checked:border-primary peer-checked:text-on-primary-container transition-colors">
<span class="material-symbols-outlined mb-1 block text-outline">do_not_disturb</span>
<span class="font-label-sm text-label-sm">No Interesado</span>
</div>
</label>
</div>
</section>
<!-- Section 3: Notas de la llamada -->
<section>
<h2 class="font-label-md text-label-md text-on-surface mb-2 px-1">Notas de la llamada</h2>
<textarea class="w-full border border-outline-variant rounded-xl p-3 bg-surface-container-lowest focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-shadow font-body-md text-body-md resize-none h-32" placeholder="Detalles de la interacción..."></textarea>
</section>
</form>
</main>
<!-- Sticky Bottom Primary Button (Above Nav) -->
<div class="fixed bottom-[56px] left-0 w-full px-md py-sm bg-gradient-to-t from-background to-transparent z-40">
<button class="w-full bg-primary text-on-primary font-label-md text-label-md rounded-lg py-3 flex items-center justify-center shadow-sm active:opacity-80 transition-opacity">
<span class="material-symbols-outlined mr-2 text-[20px]">save</span> Guardar reporte
        </button>
</div>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 w-full z-50 flex justify-around items-center px-md pb-xs pt-xs bg-surface-container-lowest dark:bg-inverse-surface border-t border-outline-variant shadow-sm rounded-t-xl h-14">
<a class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-full px-4 py-1 scale-95 transition-transform duration-200" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">edit</span>
<span class="font-label-sm text-label-sm mt-0.5">Reportar</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-variant/50 rounded-lg px-3 py-1 transition-colors" href="#">
<span class="material-symbols-outlined">list_alt</span>
<span class="font-label-sm text-label-sm mt-0.5">Mis reportes</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-variant/50 rounded-lg px-3 py-1 transition-colors" href="#">
<span class="material-symbols-outlined">person</span>
<span class="font-label-sm text-label-sm mt-0.5">Perfil</span>
</a>
</nav>
</body></html>
