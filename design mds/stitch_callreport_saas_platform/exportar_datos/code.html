<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md pb-[80px]">
<!-- TopAppBar -->
<header class="sticky top-0 w-full z-50 flex items-center px-md py-sm bg-surface border-b border-outline-variant">
<button class="mr-sm p-sm rounded-full hover:bg-surface-container-low transition-colors text-on-surface-variant flex items-center justify-center">
<span class="material-symbols-outlined text-[24px]">menu</span>
</button>
<h1 class="font-headline-sm text-headline-sm-mobile text-primary font-bold flex-1">CallReport</h1>
<div class="w-10 h-10 rounded-full bg-surface-variant flex items-center justify-center overflow-hidden border border-outline-variant">
<img class="w-full h-full object-cover" data-alt="A professional headshot of a corporate agent in a well-lit, modern office environment. The person is wearing a headset, looking confident and competent. Soft natural light, high-key corporate aesthetic, shallow depth of field, neutral gray and white background with subtle primary blue accents." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBwa0g5H_32BohbBdhfBxPdnUntdhFkyUBgosjCi-VZ0Q0HjvZAwR76TCpk6j5mIgYmxNPrKK5i-5-uOMSMMf_Fr33S_zIWgYRSwPdB4meqVOjzmlptFjMO3GzGMpeZne2lt0K0hynoX-JnElmsH-2jQX2btp-NG5fCCLJd81H46WfMZiLTHuuCDte6X4aKB7blVjARDvp1SNAVESa1rG34sv5fXKk1DhjUjCRMyBlP3Ae8uWKGb4ko"/>
</div>
</header>
<!-- Main Content -->
<main class="flex-1 px-md py-lg flex flex-col gap-lg">
<!-- Header -->
<div>
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-background mb-xs">Exportar reportes</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Configura y descarga tus datos</p>
</div>
<!-- Configuration Card -->
<div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-md shadow-sm flex flex-col gap-md">
<!-- Date Range -->
<div class="grid grid-cols-2 gap-md">
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant">Desde</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-outline">calendar_today</span>
<input class="w-full pl-[36px] pr-sm py-sm rounded-lg border border-outline-variant bg-surface-container-lowest text-on-background font-body-md text-body-md focus:border-primary focus:ring-1 focus:ring-primary outline-none" readonly="" type="text" value="01/10/2023"/>
</div>
</div>
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant">Hasta</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-outline">calendar_today</span>
<input class="w-full pl-[36px] pr-sm py-sm rounded-lg border border-outline-variant bg-surface-container-lowest text-on-background font-body-md text-body-md focus:border-primary focus:ring-1 focus:ring-primary outline-none" readonly="" type="text" value="31/10/2023"/>
</div>
</div>
</div>
<!-- Tipificación Dropdown -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant">Tipificación</label>
<div class="relative">
<select class="w-full pl-sm pr-[36px] py-sm rounded-lg border border-outline-variant bg-surface-container-lowest text-on-background font-body-md text-body-md focus:border-primary focus:ring-1 focus:ring-primary outline-none appearance-none">
<option>Todas</option>
<option>Soporte Técnico</option>
<option>Ventas</option>
<option>Reclamos</option>
</select>
<span class="material-symbols-outlined absolute right-sm top-1/2 -translate-y-1/2 text-outline pointer-events-none">expand_more</span>
</div>
</div>
<!-- Summary -->
<div class="mt-xs pt-sm border-t border-outline-variant flex justify-between items-center">
<span class="font-body-md text-body-md text-on-surface-variant">Registros a exportar</span>
<span class="font-headline-sm text-headline-sm text-primary">47 reportes</span>
</div>
</div>
<!-- Format Options -->
<div class="flex flex-col gap-sm">
<h3 class="font-label-md text-label-md text-on-surface-variant mb-xs">Formato de archivo</h3>
<div class="grid grid-cols-2 gap-md">
<!-- CSV/Excel Option -->
<button class="bg-surface-container-lowest border-2 border-primary rounded-xl p-md flex flex-col items-center justify-center gap-sm shadow-sm relative overflow-hidden group">
<div class="absolute inset-0 bg-primary/5 opacity-100 transition-opacity"></div>
<div class="w-12 h-12 rounded-full bg-primary-container text-on-primary-container flex items-center justify-center relative z-10">
<span class="material-symbols-outlined text-[24px]">table</span>
</div>
<span class="font-label-md text-label-md text-on-background relative z-10">CSV / Excel</span>
<div class="absolute top-sm right-sm text-primary z-10">
<span class="material-symbols-outlined fill text-[18px]">check_circle</span>
</div>
</button>
<!-- PDF Option -->
<button class="bg-surface-container-lowest border border-outline-variant rounded-xl p-md flex flex-col items-center justify-center gap-sm shadow-sm hover:bg-surface-container-low transition-colors">
<div class="w-12 h-12 rounded-full bg-surface-variant text-on-surface-variant flex items-center justify-center">
<span class="material-symbols-outlined text-[24px]">description</span>
</div>
<span class="font-label-md text-label-md text-on-surface-variant">PDF</span>
</button>
</div>
</div>
<!-- Action Button -->
<div class="mt-auto pt-lg pb-md">
<button class="w-full bg-primary text-on-primary font-label-md text-label-md py-[14px] rounded-lg shadow-sm hover:opacity-90 transition-opacity flex items-center justify-center gap-sm">
<span class="material-symbols-outlined text-[20px]">share</span>
                Descargar y compartir
            </button>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 w-full z-50 flex justify-around items-center px-md pb-xs pt-xs bg-surface-container-lowest border-t border-outline-variant shadow-sm rounded-t-xl md:hidden">
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-variant/50 w-16 h-14 rounded-lg transition-colors">
<span class="material-symbols-outlined mb-[2px]">grid_view</span>
<span class="font-label-sm text-label-sm">Dashboard</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-variant/50 w-16 h-14 rounded-lg transition-colors">
<span class="material-symbols-outlined mb-[2px]">history_toggle_off</span>
<span class="font-label-sm text-label-sm">Seguimientos</span>
</button>
<button class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-full px-4 py-1 scale-95 transition-transform duration-200">
<span class="material-symbols-outlined mb-[2px] fill">download</span>
<span class="font-label-sm text-label-sm">Exportar</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-variant/50 w-16 h-14 rounded-lg transition-colors">
<span class="material-symbols-outlined mb-[2px]">person</span>
<span class="font-label-sm text-label-sm">Perfil</span>
</button>
</nav>
